  <script>
    tailwind.config = (function () {
      // Design tokens (ui/tokens.css) as Tailwind colours. A function rather than a bare
      // var(): Tailwind cannot put an opacity modifier (bg-gs-primary/10) on a var() and
      // silently generates nothing, so the alpha is applied with color-mix instead.
      function tok(name) {
        return function (o) {
          var a = o && o.opacityValue;
          if (a === undefined || a === '1' || a === 1) return 'var(' + name + ')';
          return 'color-mix(in srgb, var(' + name + ') calc(' + a + ' * 100%), transparent)';
        };
      }
      return {
        theme: {
          fontFamily: {
            sans: ['IRANSansX', '"Segoe UI Variable Text"', '"Segoe UI"', 'Tahoma', 'sans-serif'],
            mono: ['"MV Mono Persian"', '"Cascadia Mono"', '"Cascadia Code"', 'Consolas', 'monospace']
          },
          extend: {
            colors: {
              gs: {
                bg: tok('--mv-window'),
                panel: tok('--mv-surface'),
                surface: tok('--mv-surface-2'),
                surface2: tok('--mv-surface-3'),
                surface3: tok('--mv-surface-4'),
                card: tok('--mv-surface-2'),
                border: tok('--mv-sep-2'),
                text: tok('--mv-label'),
                muted: tok('--mv-label-2'),
                gray: tok('--mv-label-3'),
                primary: tok('--mv-accent'),
                success: tok('--mv-green-ink'),
                danger: tok('--mv-red-ink'),
                warning: tok('--mv-orange-ink'),
                info: tok('--mv-teal-ink')
              },
              m3: {
                bg: tok('--mv-window'),
                background: tok('--mv-window'),
                surface: tok('--mv-surface'),
                surface2: tok('--mv-surface-2'),
                surface3: tok('--mv-fill-3'),
                surfaceVariant: tok('--mv-surface-3'),
                surfaceHover: tok('--mv-fill-2'),
                surfaceActive: tok('--mv-accent'),
                primary: tok('--mv-accent'),
                onPrimary: tok('--mv-on-accent'),
                onSurface: tok('--mv-label'),
                onSurfaceVariant: tok('--mv-label-2'),
                secondary: tok('--mv-label-2'),
                outline: tok('--mv-sep-2'),
                error: tok('--mv-red-ink'),
                success: tok('--mv-green-ink'),
                warning: tok('--mv-orange-ink')
              },
              syn: {
                blue: tok('--mv-accent'),
                cyan: tok('--mv-teal-ink'),
                green: tok('--mv-green-ink'),
                purple: tok('--mv-purple-ink'),
                yellow: tok('--mv-orange-ink'),
                red: tok('--mv-red-ink'),
                string: tok('--mv-orange-ink')
              },
              // The design system's own names — what new and migrated markup uses:
              // text-mv-label-2, bg-mv-fill, border-mv-sep-2, bg-mv-green/15, text-mv-red-ink.
              mv: (function () {
                var c = {
                  label: { DEFAULT: tok('--mv-label'), 2: tok('--mv-label-2'), 3: tok('--mv-label-3'), 4: tok('--mv-label-4') },
                  fill: { DEFAULT: tok('--mv-fill'), 2: tok('--mv-fill-2'), 3: tok('--mv-fill-3') },
                  sep: { DEFAULT: tok('--mv-sep'), 2: tok('--mv-sep-2'), 3: tok('--mv-sep-3') },
                  surface: { DEFAULT: tok('--mv-surface'), 2: tok('--mv-surface-2'), 3: tok('--mv-surface-3'), 4: tok('--mv-surface-4') },
                  window: tok('--mv-window'),
                  desk: tok('--mv-desk'),
                  field: tok('--mv-field'),
                  code: tok('--mv-code'),
                  scrim: tok('--mv-scrim'),
                  control: tok('--mv-control'),
                  accent: tok('--mv-accent'),
                  'on-accent': tok('--mv-on-accent')
                };
                ['blue', 'green', 'orange', 'red', 'yellow', 'teal', 'indigo', 'purple', 'pink'].forEach(function (n) {
                  c[n] = { DEFAULT: tok('--mv-' + n), ink: tok('--mv-' + n + '-ink'), fill: tok('--mv-' + (n === 'blue' ? 'accent' : n + '-fill')) };
                });
                c.gray = { DEFAULT: tok('--mv-gray'), fill: tok('--mv-gray-fill') };
                return c;
              })()
            }
          }
        }
      };
    })();
  </script>

  <style>
    /* Tailwind's preflight sets a global `border-color: var(--mv-sep-3)` (gray-200) on
       every element. Any element that carries a border utility whose COLOUR utility was
       not generated into compiled-tailwind.css therefore renders a near-white hairline
       on this dark UI — which is where the stray white lines in the panels come from.
       (Confirmed case: `border-m3-outline/30` in the V2RAY panel. `.border-m3-outline`
       is in the compiled file; the /30 opacity variant is not, so nothing sets a colour.)

       Re-pointing the default at the app's own border token fixes the existing lines and,
       more usefully, means a future utility that fails to compile degrades to the right
       colour instead of a bright scar.

       `html *` rather than `*`: tailwind.js injects preflight at RUNTIME, so its
       stylesheet lands after this block and an equal-specificity rule would lose on
       source order. One element selector (0,0,1) outranks preflight's `*` (0,0,0) while
       still losing to any real colour utility (0,1,0) — so this stays a fallback and
       never overrides a border colour someone actually asked for. */
    html *,
    html *::before,
    html *::after {
      border-color: var(--ide-border, #222222);
    }

    /* `.custom-scrollbar` was used in markup across the panels but never defined, so
       every scroll area fell back to Chromium's default bar — which paints a wide
       track with a dark border on hover. Define it once, globally, as a thin
       borderless overlay thumb; `border: none` on the track kills the hover outline. */
    .custom-scrollbar::-webkit-scrollbar,
    *::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track,
    *::-webkit-scrollbar-track {
      background: transparent;
      border: none;
      box-shadow: none;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb,
    *::-webkit-scrollbar-thumb {
      background: var(--mv-fill-3);
      border: none;
      border-radius: 3px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover,
    *::-webkit-scrollbar-thumb:hover {
      background: var(--mv-label-4);
    }

    .custom-scrollbar::-webkit-scrollbar-corner,
    *::-webkit-scrollbar-corner {
      background: transparent;
    }
  </style>

  <!-- Design system. Order matters: tokens, then the bridge that puts the existing
       markup onto them, then the new components. All three load after style.css and the
       block above so they win on equal specificity. -->
  <link rel="stylesheet" href="ui/tokens.css" />

  <script>
    window.addEventListener('error', function (e) {
      const errorDiv = document.createElement('div');
      errorDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:red;color:var(--mv-label);z-index:999999;padding:20px;font-family:var(--mv-font-mono);font-size:16px;word-wrap:break-word;';
      errorDiv.innerHTML = "<b>Uncaught Error:</b> " + e.message + "<br><b>File:</b> " + e.filename + ":" + e.lineno + ":" + e.colno + "<br><br>" + (e.error && e.error.stack ? e.error.stack.replace(/</g, '&lt;').replace(/>/g, '&gt;') : '');
      document.body.appendChild(errorDiv);
    });
    window.addEventListener('unhandledrejection', function (e) {
      const errorDiv = document.createElement('div');
      errorDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:purple;color:var(--mv-label);z-index:999999;padding:20px;font-family:var(--mv-font-mono);font-size:16px;word-wrap:break-word;';
      errorDiv.innerHTML = "<b>Unhandled Promise Rejection:</b> " + e.reason;
      document.body.appendChild(errorDiv);
    });
  </script>

<body class="layout">
  <!-- Startup system check. Deliberately the FIRST script in the body: every other script
       in this app loads at the bottom, so mounting here is what lets the overlay paint
       before the rest of the page is built instead of appearing on top of it afterwards. -->

  <!-- CUSTOM FRAMELESS TITLE BAR -->
  <header class="header-bar" style="
        -webkit-app-region: drag;
        display: flex;
        align-items: center;
        /* flex-start, not space-between: once the row overflows, space-between
           lets the packing drift and the anchored left group gets pushed off
           screen too. With flex-start plus `margin-left:auto` spacers, the
           slack lives in the margins, collapses to zero first, and the left
           group never moves. */
        justify-content: flex-start;
        /* 28px controls inside a 35px bar left only ~3px above them, while the
           workspace below opens with its own 4px padding — so the row read as
           pinned to the top. 40px gives the controls even air on both sides,
           and matches the height of the Android Studio main toolbar. */
        height: 40px;
        padding: 0 12px;
        background: transparent;
        border-bottom: none;
        /* Responsive rule for this bar: nothing resizes and nothing reorders.
           The row is laid out LTR so the fixed group anchors to the left; the
           slack between groups collapses first, and once it is gone the groups
           simply run past the right edge and are clipped there — sliding out
           one at a time instead of overlapping or vanishing. `order` keeps the
           visual arrangement while leaving the DOM untouched. */
        direction: ltr;
        overflow: hidden;
        gap: 10px;
      ">

    <div style="
          display: flex;
          align-items: center;
          direction: rtl;
          order: 3;
          flex: 0 0 auto;
          margin-left: auto;
          margin-right: 0;
