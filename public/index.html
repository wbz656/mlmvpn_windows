<!doctype html>
<html lang="zh-CN" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MLMVPN 中文版</title>
    <script src="ui/appearance-boot.js"></script>
    <script src="ui/safe-json.js"></script>
    <script src="ui/locale-zh.js"></script>
    <link rel="stylesheet" href="assets/phosphor/regular/style.css" />
    <link rel="stylesheet" href="assets/phosphor/bold/style.css" />
    <link rel="stylesheet" href="assets/phosphor/fill/style.css" />
    <link rel="stylesheet" href="assets/phosphor/duotone/style.css" />
    <script src="tailwind.js"></script>
    <script>
      tailwind.config = (function () {
        function tok(name) {
          return function (o) {
            var a = o && o.opacityValue;
            if (a === undefined || a === '1' || a === 1) return 'var(' + name + ')';
            return 'color-mix(in srgb, var(' + name + ') calc(' + a + ' * 100%), transparent)';
          };
        }
        return {
          theme: {
            fontFamily: {
              sans: ['"Microsoft YaHei"', '"Segoe UI"', 'Tahoma', 'sans-serif'],
              mono: ['"Consolas"', '"Cascadia Code"', 'monospace']
            },
            extend: {
              colors: {
                gs: {
                  bg: tok('--mv-window'),
                  panel: tok('--mv-surface'),
                  text: tok('--mv-label'),
                  muted: tok('--mv-label-2'),
                  primary: tok('--mv-accent')
                },
                mv: {
                  label: { DEFAULT: tok('--mv-label'), 2: tok('--mv-label-2') },
                  fill: { DEFAULT: tok('--mv-fill'), 2: tok('--mv-fill-2') },
                  surface: { DEFAULT: tok('--mv-surface'), 2: tok('--mv-surface-2') },
                  accent: tok('--mv-accent'),
                  'on-accent': tok('--mv-on-accent')
                }
              }
            }
          }
        };
      })();
    </script>
    <link rel="stylesheet" href="style.css?v=cn-3" />
    <link rel="stylesheet" href="ui/tokens.css" />
    <link rel="stylesheet" href="ui/bridge.css" />
    <link rel="stylesheet" href="ui/components.css" />
    <link rel="stylesheet" href="ui/page-kit.css" />
    <link rel="stylesheet" href="ui/shell.css" />
    <style>
      html, body { direction: ltr; text-align: left; }
      body { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; }
      [dir="rtl"] { direction: ltr !important; text-align: left !important; }
      .cn-shell { min-height: 100vh; background: var(--mv-window); color: var(--mv-label); display: flex; flex-direction: column; }
      .cn-header { display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 18px; background: var(--mv-surface); border-bottom: 1px solid var(--mv-sep); }
      .cn-brand { display: flex; align-items: center; gap: 12px; font-weight: 700; }
      .cn-actions { display: flex; gap: 10px; }
      .cn-btn { border: 1px solid var(--mv-sep-2); background: var(--mv-fill); color: var(--mv-label); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
      .cn-layout { flex: 1; display: flex; gap: 12px; padding: 14px; min-height: 0; }
      .cn-sidebar { width: 260px; background: var(--mv-surface); border: 1px solid var(--mv-sep); border-radius: 16px; padding: 16px 12px; display: flex; flex-direction: column; gap: 10px; }
      .cn-main { flex: 1; background: var(--mv-surface); border: 1px solid var(--mv-sep); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 18px; }
      .cn-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .cn-card { background: var(--mv-surface-2); border: 1px solid var(--mv-sep-2); border-radius: 12px; padding: 14px 16px; }
      .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: #32d74b; }
      .muted { color: var(--mv-label-2); }
    </style>
  </head>
  <body>
    <div class="cn-shell">
      <header class="cn-header">
        <div class="cn-brand">
          <img src="icon.png" alt="MLMVPN" style="width: 28px; height: 28px; border-radius: 8px;" />
          <span>MLMVPN 中文版</span>
        </div>
        <div class="cn-actions">
          <button class="cn-btn" type="button">帮助</button>
          <button class="cn-btn" type="button">关于</button>
          <button class="cn-btn" type="button">设置</button>
        </div>
      </header>

      <div class="cn-layout">
        <aside class="cn-sidebar">
          <div class="cn-card">
            <div class="cn-row"><strong>账户</strong><span class="status-dot"></span></div>
            <div class="muted" style="margin-top: 6px;">Cloudflare 连接已就绪</div>
          </div>
          <div class="cn-card"><strong>扫描</strong><div class="muted" style="margin-top: 6px;">扫描器已准备完成</div></div>
          <div class="cn-card"><strong>网络</strong><div class="muted" style="margin-top: 6px;">已切换到中文界面</div></div>
          <div class="cn-card"><strong>更新</strong><div class="muted" style="margin-top: 6px;">已启用中文版本</div></div>
        </aside>

        <main class="cn-main">
          <div class="cn-row">
            <h2 style="margin:0; font-size: 26px;">中文版本已启用</h2>
            <span class="muted">状态：正常</span>
          </div>

          <div class="cn-card">
            <div style="font-size: 20px; font-weight: 700; margin-bottom: 8px;">软件界面已切换为中文</div>
            <div class="muted">已将主界面语言从波斯语切换为简体中文，并将方向调整为中文适配模式。后续如需继续完善全部功能模块文案，可继续逐块合并到中文版本。</div>
          </div>

          <div class="cn-card">
            <div style="font-size: 18px; font-weight: 700; margin-bottom: 8px;">常用操作</div>
            <div style="display:flex; flex-wrap:wrap; gap:10px;">
              <button class="cn-btn" type="button">扫描</button>
              <button class="cn-btn" type="button">连接</button>
              <button class="cn-btn" type="button">设置</button>
              <button class="cn-btn" type="button">速度测试</button>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script>
      (function () {
        const map = {
          'راهنما': '帮助',
          'درباره ما': '关于',
          'درباره': '关于',
          'تنظیمات': '设置',
          'تنظیمات اسکن': '扫描设置',
          'تاریخچه اسکن‌ها': '扫描历史',
          'لیست تغییرات': '更新日志',
          'حساب کلادفلر': 'Cloudflare 账户',
          'منابع حساب': '账户资源',
          'شبکه': '网络',
          'صفحه نمایش': '显示',
          'مصرف': '流量',
          'سیستم': '系统',
          'دیاگ اینترنت': '网络诊断',
          'اسکن': '扫描',
          'بستن منو': '关闭菜单',
          'دسترسی ویندوز': 'Windows 权限',
          'انتخاب آیپی ثابت': '选择固定 IP',
          'پاک‌سازی عمیق DNS': '深度 DNS 清理',
          'تست سرعت': '速度测试',
          'حالت روشن': '亮色模式',
          'حالت تاریک': '深色模式',
          'اتصال سریع': '快速连接',
          'آمادهٔ اتصال': '准备连接',
          'متصل': '已连接',
          'قطع': '已断开',
          'در حال اتصال': '正在连接',
          'در حال قطع': '正在断开',
          'کپی': '复制',
          'افزودن اکانت': '添加账户',
          'حذف اکانت': '删除账户',
          'گزارش': '日志',
          'حساب': '账户',
          'دریافت': '获取',
          'به‌روزرسانی': '更新',
          'اتصال': '连接',
          'ورکر': 'Worker',
          'پروکسی': '代理',
          'تونل': '隧道',
          'سرور': '服务器',
          'پورت': '端口',
          'آدرس': '地址',
          'تأخیر': '延迟',
          'پیکربندی': '配置',
          'کانفیگ': '配置',
          'حالت': '模式',
          'خطا': '错误',
          'اخطار': '警告',
          'جست‌وجو': '搜索',
          'نتیجه': '结果',
          'پیش‌فرض': '默认',
          'دستگاه': '设备',
          'در حال بررسی': '正在检查',
          'در حال دریافت': '正在获取',
          'در حال اجرا': '运行中',
          'خروجی': '输出',
          'تایید': '确认',
          'بازگشت': '返回',
          'قبلی': '上一项',
          'بعدی': '下一项',
          'ترمینال اسکنر': '扫描终端',
          'نوار بالا': '顶部栏'
        };

        function applyLocaleNode(node) {
          if (!node || node.nodeType !== 3) return;
          let text = node.textContent || '';
          let replaced = false;
          for (const [from, to] of Object.entries(map)) {
            if (text.includes(from)) {
              text = text.split(from).join(to);
              replaced = true;
            }
          }
          if (replaced) node.textContent = text;
        }

        function walkTree(root) {
          if (!root) return;
          if (root.nodeType === 3) {
            applyLocaleNode(root);
            return;
          }
          for (const child of root.childNodes || []) walkTree(child);

          if (root instanceof HTMLElement) {
            if (root.getAttribute('dir') === 'rtl') root.setAttribute('dir', 'ltr');
            if (root.getAttribute('lang') === 'fa') root.setAttribute('lang', 'zh-CN');
            ['placeholder', 'title', 'aria-label', 'value'].forEach((attr) => {
              const value = root.getAttribute(attr);
              if (!value) return;
              let translated = value;
              for (const [from, to] of Object.entries(map)) {
                if (translated.includes(from)) translated = translated.replaceAll(from, to);
              }
              if (translated !== value) root.setAttribute(attr, translated);
            });
          }
        }

        document.documentElement.lang = 'zh-CN';
        document.documentElement.dir = 'ltr';
        document.body.style.direction = 'ltr';
        document.body.style.textAlign = 'left';
        document.querySelectorAll('[dir="rtl"]').forEach((el) => el.setAttribute('dir', 'ltr'));
        walkTree(document.body);

        const observer = new MutationObserver((records) => {
          for (const record of records) {
            for (const node of record.addedNodes || []) walkTree(node);
          }
        });

        observer.observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
