  <script>
    (function () {
      function ensureGlobal(name, impl) {
        if (typeof window[name] !== 'function') {
          window[name] = function () {
            if (typeof impl === 'function') return impl.apply(this, arguments);
            return undefined;
          };
        }
      }

      ensureGlobal('toggleMainMenu', function () {
        const menu = document.getElementById('main-menu');
        const overlay = document.getElementById('main-menu-overlay');
        if (!menu || !overlay) return;
        menu.classList.toggle('hidden');
        overlay.classList.toggle('hidden');
      });

      ensureGlobal('toggleNotificationMenu', function () {
        const menu = document.getElementById('notification-menu');
        const overlay = document.getElementById('notification-menu-overlay');
        if (!menu || !overlay) return;
        menu.classList.toggle('hidden');
        overlay.classList.toggle('hidden');
      });
    })();
  </script>

  <script>
    tailwind.config = (function () {
      function tok(name) {
        return function (o) {
          var a = o && o.opacityValue;
          if (a === undefined || a === '1' || a === 1) return 'var(' + name + ')';
          return 'color-mix(in srgb, var(' + name + ') calc(' + a + ' * 100%), transparent)';
        };
      }
      return {
        theme: {
          fontFamily: {
            sans: ['IRANSansX', '"Segoe UI Variable Text"', '"Segoe UI"', 'Tahoma', 'sans-serif'],
            mono: ['"MV Mono Persian"', '"Cascadia Mono"', '"Cascadia Code"', 'Consolas', 'monospace']
          },
          extend: {
            colors: {
              gs: {
                bg: tok('--mv-window'),
                panel: tok('--mv-surface'),
                surface: tok('--mv-surface-2'),
                surface2: tok('--mv-surface-3'),
                surface3: tok('--mv-surface-4'),
                card: tok('--mv-surface-2'),
                border: tok('--mv-sep-2'),
                text: tok('--mv-label'),
                muted: tok('--mv-label-2'),
                gray: tok('--mv-label-3'),
                primary: tok('--mv-accent'),
                success: tok('--mv-green-ink'),
                danger: tok('--mv-red-ink'),
                warning: tok('--mv-orange-ink'),
                info: tok('--mv-teal-ink')
              },
              m3: {
                bg: tok('--mv-window'),
                background: tok('--mv-window'),
                surface: tok('--mv-surface'),
                surface2: tok('--mv-surface-2'),
                surface3: tok('--mv-fill-3'),
                surfaceVariant: tok('--mv-surface-3'),
                surfaceHover: tok('--mv-fill-2'),
                surfaceActive: tok('--mv-accent'),
                primary: tok('--mv-accent'),
                onPrimary: tok('--mv-on-accent'),
                onSurface: tok('--mv-label'),
                onSurfaceVariant: tok('--mv-label-2'),
                secondary: tok('--mv-label-2'),
                outline: tok('--mv-sep-2'),
                error: tok('--mv-red-ink'),
                success: tok('--mv-green-ink'),
                warning: tok('--mv-orange-ink')
              },
              syn: {
                blue: tok('--mv-accent'),
                cyan: tok('--mv-teal-ink'),
                green: tok('--mv-green-ink'),
                purple: tok('--mv-purple-ink'),
                yellow: tok('--mv-orange-ink'),
                red: tok('--mv-red-ink'),
                string: tok('--mv-orange-ink')
              },
              mv: (function () {
                var c = {
                  label: { DEFAULT: tok('--mv-label'), 2: tok('--mv-label-2'), 3: tok('--mv-label-3'), 4: tok('--mv-label-4') },
                  fill: { DEFAULT: tok('--mv-fill'), 2: tok('--mv-fill-2'), 3: tok('--mv-fill-3') },
                  sep: { DEFAULT: tok('--mv-sep'), 2: tok('--mv-sep-2'), 3: tok('--mv-sep-3') },
                  surface: { DEFAULT: tok('--mv-surface'), 2: tok('--mv-surface-2'), 3: tok('--mv-surface-3'), 4: tok('--mv-surface-4') },
                  window: tok('--mv-window'),
                  desk: tok('--mv-desk'),
                  field: tok('--mv-field'),
                  code: tok('--mv-code'),
                  scrim: tok('--mv-scrim'),
                  control: tok('--mv-control'),
                  accent: tok('--mv-accent'),
                  'on-accent': tok('--mv-on-accent')
                };
                ['blue', 'green', 'orange', 'red', 'yellow', 'teal', 'indigo', 'purple', 'pink'].forEach(function (n) {
                  c[n] = { DEFAULT: tok('--mv-' + n), ink: tok('--mv-' + n + '-ink'), fill: tok('--mv-' + (n === 'blue' ? 'accent' : n + '-fill')) };
                });
                c.gray = { DEFAULT: tok('--mv-gray'), fill: tok('--mv-gray-fill') };
                return c;
              })()
            }
          }
        }
      };
    })();
  </script>

  <script>
    window.addEventListener('error', function (e) {
      const errorDiv = document.createElement('div');
      errorDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:red;color:var(--mv-label);z-index:999999;padding:20px;font-family:var(--mv-font-mono);font-size:16px;word-wrap:break-word';
      errorDiv.innerHTML = "<b>Uncaught Error:</b> " + e.message + "<br><b>File:</b> " + e.filename + ":" + e.lineno + ":" + e.colno + "<br><br>" + (e.error && e.error.stack ? e.error.stack.replace(/</g, '&lt;').replace(/>/g, '&gt;') : '');
      document.body.appendChild(errorDiv);
    });
    window.addEventListener('unhandledrejection', function (e) {
      const errorDiv = document.createElement('div');
      errorDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:purple;color:var(--mv-label);z-index:999999;padding:20px;font-family:var(--mv-font-mono);font-size:16px;word-wrap:break-word';
      errorDiv.innerHTML = "<b>Unhandled Promise Rejection:</b> " + e.reason;
      document.body.appendChild(errorDiv);
    });
  </script>
