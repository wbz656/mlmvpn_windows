name: Signed Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-signed-release:
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      CI: true
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Ensure core folder exists
        shell: pwsh
        run: |
          if (-not (Test-Path "core")) {
            New-Item -ItemType Directory -Path "core" | Out-Null
          }

      - name: Print tool versions
        shell: bash
        run: |
          node -v
          npm -v
          git --version

      - name: Build Windows installer
        shell: bash
        run: npm run build

      - name: Show dist output
        shell: pwsh
        run: |
          Get-ChildItem dist -Force

      - name: Sign generated files
        shell: pwsh
        if: always()
        run: |
          $files = Get-ChildItem dist -Recurse -File | Where-Object { $_.Extension -in ".exe", ".msi", ".dll" }
          foreach ($file in $files) {
            Write-Host "Signing: $($file.FullName)"
            & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /a $file.FullName
          }

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File
          foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash
            $hash | Out-File -FilePath "$($file.FullName).sha256" -Encoding ascii
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-windows-installer
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
