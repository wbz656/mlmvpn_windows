name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-portable-release:
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Ensure core folder exists
        shell: pwsh
        run: |
          if (-not (Test-Path "core")) {
            New-Item -ItemType Directory -Path "core" | Out-Null
          }

      - name: Print tool versions
        shell: bash
        run: |
          node -v
          npm -v
          git --version

      - name: Build Windows portable app
        shell: bash
        run: npm run build

      - name: Show dist output
        if: ${{ hashFiles('dist/**') != '' }}
        shell: pwsh
        run: |
          Get-ChildItem dist -Force

      - name: Sign generated files
        if: ${{ hashFiles('dist/**') != '' }}
        shell: pwsh
        env:
          WINDOWS_CODESIGN_CERT_BASE64: ${{ secrets.WINDOWS_CODESIGN_CERT_BASE64 }}
          WINDOWS_CODESIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERT_PASSWORD }}
          WINDOWS_CODESIGN_CERT_PATH: ${{ secrets.WINDOWS_CODESIGN_CERT_PATH }}
        run: |
          if (-not (Test-Path "dist")) {
            Write-Host "dist not found; nothing to sign."
            exit 0
          }

          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signtool) {
            throw "signtool.exe was not found in the Windows SDK installation."
          }

          $certBase64 = $env:WINDOWS_CODESIGN_CERT_BASE64
          $certPassword = $env:WINDOWS_CODESIGN_CERT_PASSWORD
          $certPath = $env:WINDOWS_CODESIGN_CERT_PATH

          if (-not $certBase64 -and -not $certPath) {
            Write-Host "No Windows code-signing certificate configured. Skipping signing."
            exit 0
          }

          if ($certBase64) {
            $certPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
            $bytes = [System.Convert]::FromBase64String($certBase64)
            [System.IO.File]::WriteAllBytes($certPath, $bytes)
          }

          if (-not $certPath) {
            throw "Windows code-signing certificate path is empty."
          }

          if (-not (Test-Path $certPath)) {
            throw "Windows code-signing certificate file not found: $certPath"
          }

          $files = Get-ChildItem dist -Recurse -File | Where-Object { $_.Extension -in ".exe", ".msi", ".dll" }
          foreach ($file in $files) {
            Write-Host "Signing: $($file.FullName)"
            & $signtool.FullName sign /f $certPath /p $certPassword /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $file.FullName
          }

      - name: Generate SHA256 checksums
        if: ${{ hashFiles('dist/**') != '' }}
        shell: pwsh
        run: |
          if (-not (Test-Path "dist")) {
            Write-Host "dist not found; nothing to hash."
            exit 0
          }

          $files = Get-ChildItem dist -Recurse -File
          foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash
            $hash | Out-File -FilePath "$($file.FullName).sha256" -Encoding ascii
          }

      - name: Upload build artifacts
        if: ${{ hashFiles('dist/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            dist/**/*.exe
            dist/**/*.msi
            dist/**/*.dll
            dist/**/*.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') && hashFiles('dist/**') != '' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.exe
            dist/**/*.msi
            dist/**/*.dll
            dist/**/*.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
